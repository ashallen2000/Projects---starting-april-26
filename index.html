<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <caption>Premier League Standings </caption>
        <thead>
            <tr>
                <th scope ="col">Position</th>
                <th scope ="col">Club</th>
                <th scope ="col">Points</th>
                <th scope ="col">Goal Difference</th>
                <th scope ="col">Matches Played</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td scope ="row">1</td>
                <td>Manchester United</td>
                <td>89</td>
                <td>+45</td>
                <td>38</td>
            </tr>
            <tr>
                <td scope ="row">2</td>
                <td>Liverpool</td>
                <td>85</td>
                <td>+40</td>
                <td>38</td> 
            </tr>
            <tr>
                    <td scope ="row">3</td>
                    <td>Manchester City</td>
                    <td>80</td>
                    <td>+35</td>
                    <td>38</td>
            </tr>
            <tr>
                <td scope ="row">4</td>
                <td>Arsenal</td>
                <td>78</td>
                <td>+30</td>
                <td>38</td>
            </tr>
            <tr>
                <td scope ="row">5</td>
                <td>Tottenham Hotspur</td>
                <td>75</td>
                <td>+25</td>
                <td>38</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
